name: BTC Stoch200 Paper Bot

on:
  schedule:
    - cron: '5 * * * *'  # every hour at minute 5
  workflow_dispatch:  # allow manual run

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit state and trades
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json trades.csv || true
          git diff --staged --quiet || git commit -m "Update paper state [skip ci]"
          git push

      - name: Phone alert if this run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: btc-stoch200-paper: BTC Stoch200 Paper Bot FAILED" -H "Priority: high" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Tap to open the failed run on GitHub." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
